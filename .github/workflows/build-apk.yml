name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Extract project
        run: unzip -q -o SilteCalendar-Android.zip && chmod +x SilteCalendar/gradlew
      - name: Build APK
        working-directory: SilteCalendar
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        working-directory: SilteCalendar
        run: |
          msg=$(grep -E "^e: |What went wrong|error:|Could not|^> " build.log | head -60 | sed 's#file:///home/runner/work/[^ ]*/app/#app/#; s/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::$msg"
      - uses: actions/upload-artifact@v4
        with:
          name: SilteCalendar-APK
          path: SilteCalendar/app/build/outputs/apk/debug/*.apk
